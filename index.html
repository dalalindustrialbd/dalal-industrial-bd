<script>
    const SB_URL = 'https://supabase.co';
    const SB_KEY = 'sb_publishable_BMSEoBr3WjS2VjDIe3qiwg_bTodWou4';
    let listData = [];
    let activeCat = 'all';
    const catMap = { 'desher_sotru':'🚨 দেশের ও সার্বভৌমত্বের শত্রু', 'probashi':'✈️ প্রবাসীদের দালাল', 'jomi':'🏞️ জায়গা-জমি দালাল', 'elakar_sotru':'🏘️ এলাকার শত্রু' };
    const pOrder = { 'desher_sotru':1, 'probashi':2, 'jomi':3, 'elakar_sotru':4 };

    async function init() {
        try {
            const r = await fetch(SB_URL + '/rest/v1/dalals?is_approved=eq.true&select=*', {
                headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
            });
            const d = await r.json();
            listData = Array.isArray(d) ? d.sort((a,b) => (pOrder[a.category]||5) - (pOrder[b.category]||5)) : [];
            updateStats();
            renderList();
        } catch(e) {
            document.getElementById('dalalList').innerHTML = '<p style="color:#94a3b8;">তথ্য পাওয়া যায়নি।</p>';
        }
    }

    function updateStats() {
        document.getElementById('totalDalals').innerText = listData.length + ' জন';
        document.getElementById('priorityCount').innerText = listData.filter(x => x.category==='desher_sotru'||x.category==='probashi').length + ' জন';
        const dCnt = {}, tCnt = {}, sel = document.getElementById('distFilter');
        listData.forEach(x => {
            dCnt[x.district] = (dCnt[x.district]||0) + 1;
            tCnt[x.thana] = (tCnt[x.thana]||0) + 1;
        });
        let md='', mv=0, mt='', mtv=0;
        for(let k in dCnt){
            if(dCnt[k]>mv){mv=dCnt[k]; md=k;}
            let o = document.createElement('option'); o.value=k; o.innerText=k+' জেলা'; sel.appendChild(o);
        }
        for(let k in tCnt){ if(tCnt[k]>mtv){mtv=tCnt[k]; mt=k;} }
        if(md) document.getElementById('topDistrict').innerText = md + ' (' + mv + ' জন)';
        if(mt) document.getElementById('topThana').innerText = mt + ' (' + mtv + ' জন)';
    }

    function setCat(c, el) {
        activeCat = c;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderList();
    }

    function renderList() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const df = document.getElementById('distFilter').value;
        const box = document.getElementById('dalalList');
        const res = listData.filter(x => (activeCat==='all'||x.category===activeCat) && (df===''||x.district===df) && (x.name+x.district+x.thana+(x.village||'')+(x.moholla||'')+(x.bongsho||'')).toLowerCase().includes(q));
        if(res.length === 0) {
            box.innerHTML = '<p style="color:#94a3b8; grid-column:1/-1; text-align:center; padding:2rem; background:var(--card); border-radius:10px;">এই মুহূর্তে কোনো অনুমোদিত দালালের তথ্য নেই। নতুন অভিযোগ জমা দিতে উপরের <strong>"+ গোপন অভিযোগ জমা দিন"</strong> বাটনে ক্লিক করুন।</p>';
            return;
        }
        box.innerHTML = res.map(x => `
            <div class="dalal-card ${x.category==='desher_sotru'?'p-desh':x.category==='probashi'?'p-probashi':''}">
                <div class="card-top">
                    <img src="${x.image_url||'https://placeholder.com'}" class="dalal-img">
                    <div>
                        <span class="badge b-${x.category}">${catMap[x.category]||x.category}</span>
                        <h3>${x.name}</h3>
                        <span class="count-badge">অভিযোগ সংখ্যা: ${x.complaint_count} জন</span>
                    </div>
                </div>
                <div class="card-body">
                    <p><strong>বংশ:</strong> ${x.bongsho||'উল্লেখ নেই'}</p>
                    <p><strong>জেলা ও থানা:</strong> ${x.district} (${x.thana})</p>
                    <p><strong>গ্রাম ও মহল্লা:</strong> ${x.village||'-'}, ${x.moholla||'-'}</p>
                </div>
                <div class="card-foot">
                    <span style="font-size:0.75rem; color:#94a3b8;">যাচাইকৃত</span>
                    <button type="button" class="btn-det" onclick="openDet('${x.id}')">বিস্তারিত বিবরণ</button>
                </div>
            </div>
        `).join('');
    }

    function openDet(id) {
        const x = listData.find(i => i.id === id);
        if(!x) return;
        document.getElementById('detTitle').innerText = x.name;
        document.getElementById('detContent').innerHTML = `
            <p><strong>ক্যাটাগরি:</strong> ${catMap[x.category]||x.category}</p>
            <p><strong>বংশ:</strong> ${x.bongsho||'উল্লেখ নেই'}</p>
            <p><strong>পূর্ণ ঠিকানা:</strong> গ্রাম: ${x.village||'-'}, মহল্লা: ${x.moholla||'-'}, থানা: ${x.thana}, জেলা: ${x.district}</p>
            <p><strong>মোট অভিযোগ:</strong> ${x.complaint_count} জন</p>
            <p style="margin-top:10px; color:#6ee7b7; font-size:0.85rem;">🔒 অভিযোগকারীর পরিচয় গোপন রাখা হয়েছে।</p>
        `;
        document.getElementById('detModal').style.display = 'block';
    }

    document.getElementById('cForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('subBtn');
        btn.disabled = true; btn.innerText = 'জমা হচ্ছে...';
        try {
            let pUrl = null;
            const fi = document.getElementById('d_photo');
            if(fi.files && fi.files.length > 0) {
                const f = fi.files.item(0);
                const fn = Date.now() + '_' + Math.random().toString(36).substring(7);
                const ur = await fetch(SB_URL + '/storage/v1/object/dalal-photos/' + fn, {
                    method:'POST', headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':f.type}, body:f
                });
                if(ur.ok) pUrl = SB_URL + '/storage/v1/object/public/dalal-photos/' + fn;
            }
            const cat = document.getElementById('d_category').value;
            const dr = await fetch(SB_URL + '/rest/v1/dalals', {
                method:'POST',
                headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
                body: JSON.stringify({
                    name: document.getElementById('d_name').value.trim(),
                    bongsho: document.getElementById('d_bongsho').value.trim(),
                    district: document.getElementById('d_district').value.trim(),
                    thana: document.getElementById('d_thana').value.trim(),
                    village: document.getElementById('d_village').value.trim(),
                    moholla: document.getElementById('d_moholla').value.trim(),
                    category: cat, image_url: pUrl, is_approved: false
                })
            });
            const dArr = await dr.json();
            const firstDalal = Array.isArray(dArr) ? dArr.at(0) : dArr;
            if(!dr.ok || !firstDalal || !firstDalal.id) throw new Error('দালালের তথ্য সেভ হয়নি');

            const cr = await fetch(SB_URL + '/rest/v1/complaints', {
                method:'POST',
                headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
                body: JSON.stringify({
                    dalal_id: firstDalal.id,
                    complainant_name: document.getElementById('c_name').value.trim(),
                    complainant_district: document.getElementById('c_district').value.trim(),
                    complainant_thana: document.getElementById('c_thana').value.trim(),
                    complainant_village: document.getElementById('c_village').value.trim(),
                    dalali_type: cat, description: document.getElementById('d_desc').value.trim()
                })
            });
            if(!cr.ok) throw new Error('অভিযোগ সেভ হয়নি');
            alert('ধন্যবাদ! আপনার অভিযোগটি গোপনীয়তার সাথে জমা হয়েছে। অ্যাডমিন যাচাইয়ের পর এটি তালিকায় যুক্ত হবে।');
            document.getElementById('cForm').reset();
            document.getElementById('reportModal').style.display = 'none';
        } catch(err) {
            alert('সমস্যা হয়েছে: ' + err.message);
        } finally {
            btn.disabled = false; btn.innerText = 'গোপন অভিযোগ জমা দিন';
        }
    };
    init();
</script>
</body>
</html>
